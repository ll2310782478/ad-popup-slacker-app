name: Build & Release

on:
  push:
    tags: ['v*']          # 推送 v1.0.0 这类标签时自动构建并发布 Release
  workflow_dispatch:       # 也可在 Actions 页面手动触发（只构建，不发布）

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build installers
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 不做 macOS 代码签名

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ad-popup-slacker-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ad-popup-slacker-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
